<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uma pergunta pra você 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--rosa:#ff8fb8;--rosa2:#ffc2d9;--rosa3:#fff0f6;--texto:#7a3b57;--branco:#ffffff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Fredoka","Nunito","Trebuchet MS",system-ui,sans-serif;color:var(--texto);background:radial-gradient(circle at 20% 15%,#fff 0,#fff5f9 45%,#ffeaf2 100%);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:background 1s}
body.triste{background:radial-gradient(circle at 50% 20%,#fff 0,#f3f5fa 55%,#e6eaf3 100%);color:#5b6480}
body.feliz{background:radial-gradient(circle at 50% 30%,#fff 0,#fff1f7 50%,#ffdbe9 100%)}

/* nuvens e corações flutuando no fundo */
.deco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.deco span{position:absolute;bottom:-10vh;opacity:.55;animation:sobe linear infinite}
@keyframes sobe{to{transform:translateY(-115vh) rotate(25deg)}}
body.triste .deco{opacity:.25}

main{width:100%;max-width:480px;padding:22px;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));text-align:center;position:relative;z-index:2}
.card{background:var(--branco);border-radius:36px;padding:32px 24px 28px;box-shadow:0 10px 0 #ffd9e7,0 22px 50px rgba(255,143,184,.28);border:3px solid var(--rosa3);animation:entra .7s cubic-bezier(.2,1.4,.4,1) both;position:relative}
body.triste .card{box-shadow:0 10px 0 #e3e7f1,0 22px 50px rgba(120,130,170,.2);border-color:#f1f3f8}
@keyframes entra{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1;transform:none}}
.sai{animation:sai .4s ease both}
@keyframes sai{to{opacity:0;transform:translateY(-16px) scale(.95)}}

h1{font-size:2rem;font-weight:600;margin:0 0 20px}
p{font-size:1.25rem;line-height:1.55;margin:0 0 16px;font-weight:500;min-height:1.5em}
img{max-width:100%;max-height:34vh;border-radius:22px;margin:4px auto 16px;display:block;animation:entra .7s cubic-bezier(.2,1.4,.4,1) both;border:4px solid var(--rosa3)}
.emoji{font-size:5rem;line-height:1;margin:4px 0 14px;animation:balanca 2.4s ease-in-out infinite}
@keyframes balanca{50%{transform:translateY(-8px) rotate(4deg)}}
.legenda{font-weight:600;color:var(--rosa);font-size:1.35rem;margin-bottom:8px}

.btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:6px;transition:opacity .5s,transform .5s}
.btns.oculto{opacity:0;transform:translateY(8px);pointer-events:none}
button{font:inherit;font-size:1.15rem;font-weight:600;border:0;border-radius:999px;padding:13px 30px;cursor:pointer;background:var(--rosa);color:#fff;box-shadow:0 5px 0 #f26a9c;transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-2px) scale(1.04)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #f26a9c}
button:focus-visible{outline:3px solid var(--rosa2);outline-offset:3px}
button.sec{background:#fff;color:var(--rosa);box-shadow:0 5px 0 var(--rosa2);border:2px solid var(--rosa2)}

input{font:inherit;font-size:1.2rem;width:100%;max-width:300px;text-align:center;padding:13px 18px;margin:0 0 16px;border-radius:999px;border:3px solid var(--rosa2);background:#fff;color:var(--texto);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--rosa);box-shadow:0 0 0 5px var(--rosa3)}
input::placeholder{color:#d9a9bd}
.insta{display:inline-block;margin-top:8px;color:var(--rosa);font-weight:600}
.triste-anim{animation:chora 2.2s ease both}
@keyframes chora{from{opacity:0;transform:translateY(-40px) scale(1.15);filter:grayscale(0)}to{opacity:1;transform:none;filter:grayscale(.6)}}
.gota{animation:gota 2.6s ease-in infinite}
@keyframes gota{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

.nome{font-size:2.4rem;font-weight:600;color:var(--rosa);animation:pop 1s cubic-bezier(.2,1.7,.4,1) both;animation-delay:.3s}
@keyframes pop{from{transform:scale(0) rotate(-15deg);opacity:0}to{transform:none;opacity:1}}
.pulsa{animation:pulsa .9s ease-in-out infinite}
@keyframes pulsa{50%{transform:scale(1.2)}}
.chuva{position:fixed;top:-10vh;z-index:3;pointer-events:none;animation:cai linear forwards}
@keyframes cai{to{transform:translateY(120vh) rotate(360deg)}}
canvas{position:fixed;inset:0;pointer-events:none;z-index:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="deco" id="deco"></div>
<canvas id="c"></canvas>
<main><div class="card" id="card"></div></main>

<script>
const card = document.getElementById('card');
const IMG = {
  timido: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRIlsnjLE7fkq-fJvdzzZcTJMVgVV-7Wm43Kc-Fp6a6kQ&s=10",
  chance: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQOPkY3EYPpcXW6vGERFTrLInsaPM32Eo3cOYPvXcWo3Q&s=10",
  assim:  "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRYQzXLLGPQJFUnv93g-PpIcCLp_JldcaKfZmB0VRSseQ&s=10",
  beijo:  "https://img.magnific.com/vetores-premium/emoticons-de-beijo_1303870-125.jpg?semt=ais_hybrid&w=740&q=80",
  choro:  "https://thumbs.dreamstime.com/z/emoticon-com-cor-partido-triste-olhos-marejados-segurar-um-cora%C3%A7%C3%A3o-vermelho-360116464.jpg",
  gif:    "https://media.tenor.com/O_9N9M42jQMAAAAM/bistecone.gif"
};
const FALLBACK = {timido:"😳", chance:"🥺", assim:"😍", beijo:"😘", choro:"💔", gif:"😏"};
/* Coloque aqui seu @ do Instagram (ex: "lucas.dev"). Se ficar vazio, mostra só o texto. */
const INSTAGRAM = "";

const passos = [
  {t:"Sabe... Quando eu te vi na escola eu te achei muito bonita ó 👁️👄👁️"},
  {t:"Então.. eu sou tímido que é lazo, mas eu sou bom em programar então tô usando isso pra falar com você 💻", img:"timido"},
  {t:"Annye, eu queria saber se a gente poderia se conhecer melhor, sem pressão nenhuma 🙂", img:"chance", legenda:"sem pressa, tá? 💕"},
  {t:"Você não sabe quem sou eu, mas eu vou falar depois. Sou da escola mesmo, mas não sou da sua sala também 🤫"},
  {t:"Quando eu te vejo eu fico assim óh:", img:"assim"},
  {t:"Aaaa chega de texto, você quer tentar algo? Qualquer resposta é bem-vinda, tá? 🤍", img:"beijo", final:true}
];

/* decoração de fundo */
(function(){
  const d = document.getElementById('deco'), e = ['💗','☁️','✨','🤍','🌸','💞'];
  for (let i=0;i<16;i++){
    const s = document.createElement('span');
    s.textContent = e[i%e.length];
    s.style.left = Math.random()*100+'vw';
    s.style.fontSize = (16+Math.random()*22)+'px';
    s.style.animationDuration = (12+Math.random()*14)+'s';
    s.style.animationDelay = (-Math.random()*20)+'s';
    d.append(s);
  }
})();

function img(chave){
  const i = new Image();
  i.alt = ""; i.referrerPolicy = "no-referrer";
  i.onerror = () => {
    const d = document.createElement('div');
    d.className = 'emoji'; d.textContent = FALLBACK[chave];
    i.replaceWith(d);
  };
  i.src = IMG[chave];
  return i;
}

function trocar(render){
  card.classList.add('sai');
  setTimeout(()=>{
    card.classList.remove('sai');
    card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
    card.innerHTML = '';
    render();
  }, 400);
}

function btn(txt, fn, sec){
  const b = document.createElement('button');
  b.textContent = txt;
  if (sec) b.className = 'sec';
  b.onclick = fn;
  return b;
}

/* texto digitando, depois mostra os botões */
function digitar(el, texto, aoFim){
  const chars = Array.from(texto); let i = 0;
  const reduz = matchMedia('(prefers-reduced-motion:reduce)').matches;
  if (reduz){ el.textContent = texto; aoFim(); return; }
  (function passo(){
    el.textContent = chars.slice(0, ++i).join('');
    if (i < chars.length) setTimeout(passo, 28); else aoFim();
  })();
}

function pergunta(){
  card.innerHTML = '';
  const e = document.createElement('div');
  e.className = 'emoji'; e.textContent = '💌';
  const h = document.createElement('h1');
  h.textContent = 'Você namora?';
  const sub = document.createElement('p');
  sub.textContent = 'Pode responder com sinceridade, qualquer resposta é ok 🤍';
  sub.style.fontSize = '1rem';
  const row = document.createElement('div');
  row.className = 'btns';
  row.append(btn('Sim', triste), btn('Não', ()=>trocar(()=>passo(0))));
  card.append(e, h, sub, row);
}

/* "Sim": fim triste, sem botão de voltar */
function triste(){
  trocar(()=>{
    const e = document.createElement('div');
    e.className = 'emoji';
    e.textContent = '🌷';
    const p = document.createElement('p');
    p.textContent = 'Tudo certo! Obrigado por responder, e desculpa o incômodo. Te desejo um ótimo dia 🤍';
    card.append(e, p);
  });
}

function passo(n){
  const s = passos[n];
  const p = document.createElement('p');
  card.append(p);
  let leg = null;
  if (s.img){
    card.append(img(s.img));
    if (s.legenda){
      leg = document.createElement('div');
      leg.className = 'legenda'; leg.textContent = s.legenda;
      card.append(leg);
    }
  }
  const row = document.createElement('div');
  row.className = 'btns oculto';
  if (s.final) row.append(btn('Sim 💗', aceitar), btn('Não, obrigado(a) 🤍', recusar));
  else row.append(btn('Continuar 💕', ()=>trocar(()=>passo(n+1))));
  card.append(row);
  digitar(p, s.t, ()=>row.classList.remove('oculto'));
}

/* "Não": imagem triste com transição suave, sem voltar */
function recusar(){
  trocar(()=>{
    const e = document.createElement('div');
    e.className = 'emoji';
    e.textContent = '🌷';
    const p = document.createElement('p');
    p.textContent = 'Tudo bem, de verdade! Obrigado por ter lido até aqui. Um ótimo dia pra você 🤍';
    card.append(e, p);
  });
}

const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');

function aceitar(){
  trocar(()=>{
    const e = document.createElement('div');
    e.className = 'emoji pulsa'; e.textContent = '🥳';
    const p = document.createElement('p');
    p.textContent = 'AEEE QUE BOM! Mas antes, quem você acha que eu sou? Escreva o nome 😁';
    const inp = document.createElement('input');
    inp.type = 'text'; inp.placeholder = 'Escreva aqui...';
    inp.autocomplete = 'off'; inp.maxLength = 40;
    const row = document.createElement('div');
    row.className = 'btns';
    const enviar = () => {
      if (!inp.value.trim()) { inp.focus(); return; }
      norm(inp.value) === 'lucas' ? revelar() : errou();
    };
    row.append(btn('Enviar 💌', enviar));
    inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') enviar(); });
    card.append(e, p, inp, row);
    setTimeout(()=>inp.focus(), 100);
  });
}

function errou(){
  trocar(()=>{
    const p = document.createElement('p');
    p.textContent = 'Quase acertou hein 😏';
    const g = img('gif');
    g.style.maxHeight = '32vh';
    const q = document.createElement('p');
    q.textContent = 'Fale comigo no instagram!';
    q.style.fontWeight = '600';
    q.style.color = 'var(--rosa)';
    q.style.opacity = '0';
    q.style.transition = 'opacity 1s';
    card.append(p, g, q);
    if (INSTAGRAM){
      const a = document.createElement('a');
      a.href = 'https://instagram.com/' + INSTAGRAM.replace('@','');
      a.target = '_blank'; a.rel = 'noopener';
      a.textContent = '@' + INSTAGRAM.replace('@','');
      a.className = 'insta';
      q.append(document.createElement('br'), a);
    }
    setTimeout(()=>q.style.opacity = '1', 1800);
  });
}

function revelar(){
  trocar(()=>{
    document.body.classList.add('feliz');
    const e = document.createElement('div');
    e.className = 'emoji pulsa'; e.textContent = '🥰';
    const p = document.createElement('p');
    p.textContent = 'ACERTOU! 🎉 Meu nome é';
    const n = document.createElement('div');
    n.className = 'nome'; n.textContent = 'Lucas, Aeeeee! 🎉';
    card.append(e, p, n);
    festa();
  });
}

function festa(){
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const aj = () => { cv.width = innerWidth; cv.height = innerHeight; };
  aj(); addEventListener('resize', aj);
  const cores = ['#ff8fb8','#ffc2d9','#ffe08a','#b8e6ff','#d9c2ff','#ffb3a0'];
  const pcs = Array.from({length:150}, () => ({
    x: Math.random()*cv.width, y: -Math.random()*cv.height,
    r: 4+Math.random()*6, vy: 1.5+Math.random()*3, vx: -1+Math.random()*2,
    o: Math.random()*6, c: cores[Math.floor(Math.random()*cores.length)]
  }));
  (function frame(){
    ctx.clearRect(0,0,cv.width,cv.height);
    pcs.forEach(p => {
      p.o += .05; p.x += p.vx + Math.sin(p.o)*.8; p.y += p.vy;
      if (p.y > cv.height + 10){ p.y = -10; p.x = Math.random()*cv.width; }
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fillStyle = p.c; ctx.fill();
    });
    requestAnimationFrame(frame);
  })();
  const em = ['💖','💗','💘','💝','✨','🥳','🌸','🤍'];
  setInterval(() => {
    const s = document.createElement('span');
    s.className = 'chuva';
    s.textContent = em[Math.floor(Math.random()*em.length)];
    s.style.left = Math.random()*100+'vw';
    s.style.fontSize = (22+Math.random()*20)+'px';
    s.style.animationDuration = (3+Math.random()*3)+'s';
    document.body.append(s);
    setTimeout(()=>s.remove(), 6500);
  }, 200);
}

pergunta();
</script>
</body>
</html>
